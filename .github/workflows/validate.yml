name: Pull Request Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: scripts

jobs:
  testes:
    name: Run the complete test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run complete unittest suite
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

  pacotes:
    name: Validate and build all packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate and package each plugin without publishing
        run: |
          set -euo pipefail
          shopt -s nullglob
          configs=(plugins/*/gateway.json)
          if [ "${#configs[@]}" -eq 0 ]; then
            echo "no converted plugins yet; nothing to validate"
            exit 0
          fi
          for config in "${configs[@]}"; do
            plugin_id="$(basename "$(dirname "$config")")"
            echo "== ${plugin_id} =="
            python3 -m gateway validate --plugin-id "$plugin_id" --repo-root .
            python3 -m gateway package --plugin-id "$plugin_id" --repo-root . \
              --output-dir "$RUNNER_TEMP/dist"
          done
          echo "all packages built locally in $RUNNER_TEMP/dist"
