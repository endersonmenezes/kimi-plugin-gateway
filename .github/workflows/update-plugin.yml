name: IssueOps — Update Converted Plugin

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue-number:
        description: Update issue number to run or retry
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONPATH: scripts
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    name: Prepare event and concurrency key
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      issue-number: ${{ steps.event.outputs.issue-number }}
      plugin-key: ${{ steps.event.outputs.plugin-key }}
      skip: ${{ steps.event.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build issue event and concurrency key
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          DISPATCH_ISSUE_NUMBER: ${{ inputs.issue-number }}
        run: |
          set -euo pipefail
          python3 - "$EVENT_NAME" "$EVENT_PATH" "$DISPATCH_ISSUE_NUMBER" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from gateway.issues import parse_issue_form, validate_plugin_id

          event_name, event_path, dispatch_number = sys.argv[1:4]

          def emit(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  print(f"{key}={value}", file=fh)

          if event_name == "workflow_dispatch":
              number = dispatch_number.strip()
              if not number.isdigit():
                  print(f"invalid issue number: {number!r}", file=sys.stderr)
                  sys.exit(1)
          else:
              data = json.loads(Path(event_path).read_text(encoding="utf-8"))
              issue = data.get("issue") or {}
              number = str(issue.get("number") or "")
              labels = {str(label.get("name")) for label in issue.get("labels") or []}
              if "update" not in labels:
                  print("Issue does not have the 'update' label; nothing to do.")
                  emit("skip", "true")
                  emit("issue-number", number)
                  sys.exit(0)

          payload = subprocess.run(
              ["gh", "issue", "view", number, "--json", "number,body,labels"],
              check=True, capture_output=True, text=True,
          ).stdout
          issue_data = json.loads(payload)
          if event_name == "workflow_dispatch":
              labels = {str(label.get("name")) for label in issue_data.get("labels") or []}
              if "update" not in labels:
                  print("Issue does not have the 'update' label; nothing to do.")
                  emit("skip", "true")
                  emit("issue-number", number)
                  sys.exit(0)
          body = issue_data.get("body") or ""
          fields = parse_issue_form(body)
          raw_id = fields.get("Gateway plugin ID", "").strip()
          try:
              key = validate_plugin_id(raw_id)
          except Exception:
              key = "invalid-id-" + (number or "0")

          emit("issue-number", number)
          emit("plugin-key", key)
          PY

  update:
    name: Update plugin and open PR
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: issueops-update-${{ needs.prepare.outputs.plugin-key }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue-number }}
      GATEWAY_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Materialize issue event in this runner
        id: issue-event
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" --json number,body \
            > "$RUNNER_TEMP/issue-payload.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          payload = json.loads(
              (runner_temp / "issue-payload.json").read_text(encoding="utf-8"))
          target = runner_temp / "issue-event.json"
          target.write_text(
              json.dumps({"issue": payload}, ensure_ascii=False),
              encoding="utf-8")
          print(f"issue event written to {target}")
          PY
          echo "event-path=$RUNNER_TEMP/issue-event.json" >> "$GITHUB_OUTPUT"

      - name: Prepare issue branch
        id: branch
        run: |
          set -euo pipefail
          pattern="refs/heads/issueops/issue-${ISSUE_NUMBER}-*"
          mapfile -t found < <(git ls-remote --heads origin "$pattern" | awk '{print $2}')
          if [ "${#found[@]}" -gt 1 ]; then
            echo "more than one branch exists for issue #${ISSUE_NUMBER}:" >&2
            printf '%s\n' "${found[@]}" >&2
            exit 1
          fi
          if [ "${#found[@]}" -eq 1 ]; then
            branch="${found[0]#refs/heads/}"
            git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            git checkout -B "$branch" "refs/remotes/origin/${branch}"
          else
            git checkout -b "issueops/issue-${ISSUE_NUMBER}-pending"
          fi
          echo "branch-atual=$(git branch --show-current)" >> "$GITHUB_OUTPUT"

      - name: Update from issue
        id: update
        env:
          EVENT_PATH: ${{ steps.issue-event.outputs.event-path }}
        run: |
          set -euo pipefail
          if [ ! -f marketplace.json ]; then
            printf '{\n  "version": "2",\n  "plugins": []\n}\n' > marketplace.json
          fi
          if ! summary="$(python3 -m gateway update \
              --issue-event "$EVENT_PATH" \
              --repo-root . \
              --marketplace marketplace.json \
              --owner-repo "$GATEWAY_REPO" \
              2> "$RUNNER_TEMP/update-error.txt")"; then
            cat "$RUNNER_TEMP/update-error.txt" >&2
            exit 1
          fi
          printf '%s\n' "$summary"
          printf '%s\n' "$summary" > "$RUNNER_TEMP/update-summary.txt"
          plugin_id="$(awk -F': ' '/^plugin: /{print $2; exit}' "$RUNNER_TEMP/update-summary.txt")"
          if [ -z "$plugin_id" ]; then
            echo "the CLI did not report the updated plugin ID" >&2
            exit 1
          fi
          echo "plugin-id=$plugin_id" >> "$GITHUB_OUTPUT"

      - name: Validate and package locally
        env:
          PLUGIN_ID: ${{ steps.update.outputs.plugin-id }}
        run: |
          set -euo pipefail
          python3 -m gateway validate --plugin-id "$PLUGIN_ID" --repo-root .
          python3 -m gateway package --plugin-id "$PLUGIN_ID" --repo-root . \
            --output-dir "$RUNNER_TEMP/dist"

      - name: Consolidate branch, push, and open PR
        env:
          PLUGIN_ID: ${{ steps.update.outputs.plugin-id }}
          BRANCH_ATUAL: ${{ steps.branch.outputs.branch-atual }}
        run: |
          set -euo pipefail
          branch="issueops/issue-${ISSUE_NUMBER}-${PLUGIN_ID}"
          if [ "$BRANCH_ATUAL" != "$branch" ]; then
            git branch -m "$branch"
          fi
          export BRANCH_NAME="$branch"
          conflict="$(gh pr list --state open --limit 200 --json headRefName,url | python3 -c '
          import json, os, sys
          mine = os.environ["BRANCH_NAME"]
          suffix = "-" + os.environ["PLUGIN_ID"]
          for pr in json.load(sys.stdin):
              head = pr["headRefName"]
              if head.startswith("issueops/issue-") and head.endswith(suffix) and head != mine:
                  print(pr["url"])
                  break
          ')"
          if [ -n "$conflict" ]; then
            {
              printf "an open PR already exists for plugin '%s' from another issue: %s\n" "$PLUGIN_ID" "$conflict"
              printf "review or close that PR before retrying this operation.\n"
            } | tee "$RUNNER_TEMP/update-error.txt" >&2
            exit 1
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "branch already reflects the update; nothing to commit"
          else
            git add -A
            git commit -m "feat: update plugin ${PLUGIN_ID} (issue #${ISSUE_NUMBER})"
          fi
          git push origin "$branch"
          if gh pr view "$branch" --json number --jq .number > /dev/null 2>&1; then
            echo "a PR for branch $branch already exists; the regular push updated it"
          else
            {
              printf 'Automatic update of plugin `%s` requested in issue #%s.\n\n' "$PLUGIN_ID" "$ISSUE_NUMBER"
              printf 'Operation summary:\n\n```text\n'
              cat "$RUNNER_TEMP/update-summary.txt"
              printf '```\n\nHuman review is required before merging.\n\nCloses #%s\n' "$ISSUE_NUMBER"
            } > "$RUNNER_TEMP/pr-body.md"
            gh pr create --base main --head "$branch" \
              --title "feat: update plugin ${PLUGIN_ID} (issue #${ISSUE_NUMBER})" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi

      - name: Comment error on issue
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf 'Automatic update failed. Reason:\n\n```text\n'
            if [ -s "$RUNNER_TEMP/update-error.txt" ]; then
              cat "$RUNNER_TEMP/update-error.txt"
            else
              printf 'see the workflow run log for the failed step\n'
            fi
            printf '```\n\nRun: %s\n' "$RUN_URL"
          } > "$RUNNER_TEMP/issue-comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/issue-comment.md"
