name: Update a converted plugin
description: Request an update of an existing plugin to a new upstream tag, branch, or commit
title: "[update] <plugin-id>"
labels: ["update"]
body:
  - type: markdown
    attributes:
      value: |
        Complete this form to request an upstream update. The workflow resolves
        the new ref, updates the real submodule, preserves reviewed overlays and
        manifest edits, and opens a pull request linked to this issue.
  - type: input
    id: plugin-id
    attributes:
      label: Gateway plugin ID
      description: "ID of an existing plugins/<id>/ directory in this repository"
      placeholder: "my-plugin"
    validations:
      required: true
  - type: input
    id: requested-ref
    attributes:
      label: Source tag, branch, or commit
      description: "A new tag (for example v1.3.0), branch, or full upstream commit SHA"
      placeholder: "v1.3.0"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Update reason (optional)
      description: "Context for reviewers: why the update is needed and any relevant upstream changes"
    validations:
      required: false
